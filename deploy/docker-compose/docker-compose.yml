# =============================================================================
# ApollosAI Docker Compose Stack
# =============================================================================
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in all CHANGE_ME values
#   2. Build the app image locally (it is NOT available on a public registry):
#        docker compose build app
#      This requires the base image. Pull it once (or rebuild when deps change):
#        docker pull ghcr.io/jrmatherly/apollosai:latest   # OR
#        ./containers/build.sh -i openhands
#
# Usage:
#   docker compose build app && docker compose up -d              # Production
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up  # Dev
#
# NOTE: Do NOT use "docker compose pull" — it will fail on the app service
# because the image (apollosai:latest) is built locally, not from a registry.
# Use "docker compose pull --ignore-buildable" to pull only external images,
# or just "docker compose up -d" which pulls missing external images
# automatically.
#
# =============================================================================

services:
  app:
    build:
      context: ../../
      dockerfile: ./containers/apollosai/Dockerfile
    image: apollosai:latest
    container_name: apollosai-app
    # Explicit env vars only — do NOT use env_file (leaks Postgres/Grafana
    # passwords into the app container, violating least-privilege).
    environment:
      - APP_DISPLAY_NAME=${APP_DISPLAY_NAME:-ApollosAI}
      - APP_MODE=${APP_MODE:-saas}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-apollosai}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_BASE:-./workspace}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - APOLLOSAI_ENCRYPTION_KEY=${APOLLOSAI_ENCRYPTION_KEY}
      - APOLLOSAI_ALLOW_UNAUTHENTICATED=${APOLLOSAI_ALLOW_UNAUTHENTICATED:-false}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=${SANDBOX_RUNTIME_CONTAINER_IMAGE}
      - SQLALCHEMY_POOL_SIZE=${SQLALCHEMY_POOL_SIZE:-20}
      - SQLALCHEMY_MAX_OVERFLOW=${SQLALCHEMY_MAX_OVERFLOW:-30}
      - SQLALCHEMY_POOL_RECYCLE=${SQLALCHEMY_POOL_RECYCLE:-1800}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # WARNING: Docker socket mount grants root-equivalent access to the host.
      # See deploy/docs/deployment-guide.md for security recommendations
      # (rootless Docker, Sysbox runtime).
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_BASE:-./workspace}:/opt/workspace_base
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    container_name: apollosai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apollosai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-apollosai}
    # No host port binding — internal only. Use docker-compose.dev.yml for host access.
    volumes:
      # PG 18+ uses version-specific subdirectory under /var/lib/postgresql
      # Mount at /var/lib/postgresql (not /data) to support pg_upgrade --link
      - apollosai-pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apollosai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:8.0.2
    container_name: apollosai-redis
    command: >-
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    # No host port binding — internal only. Use docker-compose.dev.yml for host access.
    volumes:
      - apollosai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: apollosai-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    # No host port bindings — app reaches collector via Docker network
    # (otel-collector:4317). Expose in docker-compose.dev.yml if needed.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: apollosai-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # No host port bindings — access traces through Grafana's Jaeger datasource.
    # Expose 16686 in docker-compose.dev.yml for direct UI access.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: apollosai-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - apollosai-prometheus-data:/prometheus
    # No host port binding — Grafana accesses via Docker network. Expose in dev overrides.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

  grafana:
    image: grafana/grafana:11.0.0
    container_name: apollosai-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - apollosai-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  apollosai-pgdata:
  apollosai-redis-data:
  apollosai-prometheus-data:
  apollosai-grafana-data:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollosai
  namespace: apollosai
  labels:
    app.kubernetes.io/name: apollosai
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apollosai
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apollosai
        app.kubernetes.io/component: app
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: apollosai
          image: ghcr.io/jrmatherly/apollosai:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: apollosai-config
            - secretRef:
                name: apollosai-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: workspace
              mountPath: /opt/workspace_base
      volumes:
        # WARNING: Docker socket mount grants root-equivalent access.
        # See deploy/docs/deployment-guide.md for rootless Docker / Sysbox.
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: workspace
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: apollosai
              app.kubernetes.io/component: app

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apollosai

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - postgres-statefulset.yaml
  - redis-deployment.yaml
  - migration-job.yaml

# Secrets from untracked .env file — never committed to git.
# Create deploy/k8s/base/.env with KEY=VALUE pairs:
#   DATABASE_URL=postgresql+asyncpg://...
#   REDIS_URL=redis://...
#   REDIS_PASSWORD=...
#   POSTGRES_PASSWORD=...
#   JWT_SECRET=...
#   SESSION_SECRET=...
#   APOLLOSAI_ENCRYPTION_KEY=...
#   LLM_API_KEY=...
secretGenerator:
  - name: apollosai-secrets
    envs:
      - .env

apiVersion: v1
kind: ConfigMap
metadata:
  name: apollosai-config
  namespace: apollosai
data:
  APP_MODE: "saas"
  APP_DISPLAY_NAME: "ApollosAI"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://apollosai-otel-collector:4317"
  OTEL_SERVICE_NAME: "apollosai"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  SQLALCHEMY_POOL_SIZE: "20"
  SQLALCHEMY_MAX_OVERFLOW: "30"
  SQLALCHEMY_POOL_RECYCLE: "1800"

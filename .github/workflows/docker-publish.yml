# Validated Docker publish workflow with smoke test.
# Complements ghcr-build.yml (which handles push-to-main and all tags).
# Use this workflow for explicit, smoke-tested image publishes.
name: Docker Publish (Validated)

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build"
        required: true
        type: choice
        options:
          - apollosai
          - openhands
        default: apollosai
      smoke_test:
        description: "Run smoke test before push"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build, Test, Push
    runs-on: ubuntu-22.04
    env:
      INPUT_IMAGE: ${{ inputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner
        run: |
          echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Determine image and tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_NAME="${INPUT_IMAGE}"

          if [[ "${IMAGE_NAME}" == "apollosai" ]]; then
            DOCKERFILE="containers/apollosai/Dockerfile"
            IMAGE_REF="${REGISTRY}/${REPO_OWNER}/apollosai/enterprise-server"
          else
            DOCKERFILE="containers/app/Dockerfile"
            IMAGE_REF="${REGISTRY}/${REPO_OWNER}/openhands"
          fi

          TAGS="${IMAGE_REF}:sha-${SHORT_SHA}"

          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image (load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: inputs.smoke_test != false
        run: |
          IMAGE_TAG="${{ steps.meta.outputs.image_ref }}:sha-${{ steps.meta.outputs.short_sha }}"
          echo "Starting container from ${IMAGE_TAG}..."

          CONTAINER_ID=$(docker run -d \
            -p 3000:3000 \
            -e APOLLOSAI_ALLOW_UNAUTHENTICATED=true \
            -e WORKSPACE_BASE=/tmp/workspace \
            "${IMAGE_TAG}")

          echo "Container started: ${CONTAINER_ID}"

          # Wait for healthy (up to 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Health check passed after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Health check failed after 60s"
              docker logs "${CONTAINER_ID}"
              docker stop "${CONTAINER_ID}"
              exit 1
            fi
            sleep 2
          done

          # Verify response
          HEALTH=$(curl -sf http://localhost:3000/health)
          echo "Health response: ${HEALTH}"

          docker stop "${CONTAINER_ID}"
          echo "Smoke test passed"

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

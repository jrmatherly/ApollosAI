name: Helm Lint

on:
  pull_request:
    paths:
      - "deploy/helm/**"
  workflow_dispatch:

jobs:
  helm-lint:
    name: Lint and Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint (default values)
        run: helm lint deploy/helm/apollosai

      - name: Helm lint (prod values)
        run: helm lint deploy/helm/apollosai -f deploy/helm/apollosai/values-prod.yaml

      - name: Helm template (default values)
        run: helm template apollosai deploy/helm/apollosai > /dev/null

      - name: Helm template (dev values)
        run: helm template apollosai deploy/helm/apollosai -f deploy/helm/apollosai/values-dev.yaml > /dev/null

      - name: Helm template (prod values)
        run: helm template apollosai deploy/helm/apollosai -f deploy/helm/apollosai/values-prod.yaml > /dev/null
